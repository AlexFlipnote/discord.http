name: Check PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install_dev

      - name: Run Ruff
        run: make lint

  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install_dev

      - name: Run Pyright
        run: make type

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install_dev

      - name: Run Tests
        run: make test
